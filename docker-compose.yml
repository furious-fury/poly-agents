server:
  build:
    context: ./server
    dockerfile: Dockerfile
  ports:
    - "5000:5000"
  environment:
    - NODE_ENV=production
    - PORT=5000
    - DATABASE_URL=${DATABASE_URL}
    - REDIS_URL=${REDIS_URL}
    - ADMIN_SECRET=${ADMIN_SECRET}
    - FRONTEND_DOMAIN=${FRONTEND_DOMAIN}
    - PIMLICO_API_KEY=${PIMLICO_API_KEY}
    - POLYGON_RPC_URL=${POLYGON_RPC_URL}
    - REDIS_HOST=${REDIS_HOST}
    - REDIS_PORT=${REDIS_PORT}
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - OPENAI_API_KEY=${OPENAI_API_KEY}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    - POLYMARKET_API_KEY=${POLYMARKET_API_KEY}
    - PRIVATE_KEY=${PRIVATE_KEY}
    - POLY_PROXY_URL=${POLY_PROXY_URL}
    - HTTPS_PROXY=${POLY_PROXY_URL}
    - HTTP_PROXY=${POLY_PROXY_URL}
    - POLY_BUILDER_API_KEY=${POLY_BUILDER_API_KEY}
    - POLY_BUILDER_SECRET=${POLY_BUILDER_SECRET}
    - POLY_BUILDER_PASSPHRASE=${POLY_BUILDER_PASSPHRASE}
  restart: always

nginx:
  image: nginx:alpine
  ports:
    - "80:80"
    - "443:443"
  volumes:
    - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    - ./certbot/conf:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
  depends_on:
    - server
  restart: always

certbot:
  image: certbot/certbot
  volumes:
    - ./certbot/conf:/etc/letsencrypt
    - ./certbot/www:/var/www/certbot
