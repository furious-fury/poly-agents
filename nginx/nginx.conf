events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream api {
        server server:5000;
    }

    # HTTP Server (Redirect to HTTPS)
    server {
        listen 80;
        listen [::]:80;
        server_name api.polyagents.tech;

        # Allow Certbot to validate ownership
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.polyagents.tech;

        # SSL Certificates (Generated by Certbot)
        ssl_certificate /etc/letsencrypt/live/api.polyagents.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.polyagents.tech/privkey.pem;

        # SSL Settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Proxy to Backend
        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
