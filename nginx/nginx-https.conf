events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    upstream api {
        server server:5000;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.polyagents.tech localhost;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.polyagents.tech;

        # SSL Certificates (Volume mapped)
        ssl_certificate /etc/letsencrypt/live/api.polyagents.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.polyagents.tech/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
